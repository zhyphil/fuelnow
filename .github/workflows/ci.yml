name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: test
      NODE_ENV: test
      SOURCE_SYNC_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm check

      - name: Export iOS and Android bundles
        run: pnpm mobile:export

      - name: Check generated native privacy configuration
        run: pnpm --filter @fuel-now/mobile privacy:check

      - name: Start disposable integration database service
        run: docker compose up --detach --wait db

      - name: Check canonical import transactions and SQL-backed API
        env:
          LOAD_TEST_DATABASE_URL: postgresql://fuel_now:fuel_now@127.0.0.1:5432/fuel_now
        run: pnpm --filter @fuel-now/api test:import-local

      - name: Check backup restoration into a fresh isolated database
        env:
          LOAD_TEST_DATABASE_URL: postgresql://fuel_now:fuel_now@127.0.0.1:5432/fuel_now
        run: pnpm --filter @fuel-now/api test:restore-local

      - name: Stop integration database service
        if: always()
        run: docker compose down

      - name: Build portable API image
        run: docker build --tag fuel-now-api:ci .

      - name: Smoke-test restricted runtime without network access
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,noexec,nosuid,size=32m
          --cap-drop ALL --security-opt no-new-privileges
          --mount "type=bind,src=$PWD/apps/api/scripts/container-smoke.mjs,dst=/app/apps/api/scripts/container-smoke.mjs,readonly"
          fuel-now-api:ci node --import tsx scripts/container-smoke.mjs
